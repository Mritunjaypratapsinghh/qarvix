name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck
        run: |
          sudo apt-get install -y shellcheck
          shellcheck build/build-iso.sh installer/install.sh
          find config/runit -name 'run' -exec shellcheck {} +

      - name: Validate TOML/JSON/YAML
        run: |
          python3 -c "import json; [json.load(open(f)) for f in ['config/sway/waybar.json']]"
          pip install toml
          python3 -c "import toml; toml.load('config/greetd/config.toml')"

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qarvix-tools
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --release

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: qarvix-tools
          path: |
            qarvix-tools/target/release/qarvix-ctl
            qarvix-tools/target/release/qarvix-dev
