name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Build release binaries
        working-directory: qarvix-tools
        run: cargo build --release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            qarvix-tools/target/release/qarvix-ctl
            qarvix-tools/target/release/qarvix-dev

  build-iso:
    runs-on: ubuntu-latest
    needs: build-tools
    container:
      image: voidlinux/voidlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          xbps-install -Syu -y
          xbps-install -y xorriso squashfs-tools grub-x86_64-efi

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: usr-local-bin/

      - name: Inject binaries into build
        run: |
          mkdir -p config/usr-local-bin
          cp usr-local-bin/qarvix-tools/target/release/qarvix-* config/usr-local-bin/
          chmod +x config/usr-local-bin/*

      - name: Build ISO
        run: bash build/build-iso.sh

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: qarvix-iso
          path: out/*.iso

  release:
    runs-on: ubuntu-latest
    needs: [build-tools, build-iso]
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            qarvix-iso/*.iso
            binaries/qarvix-tools/target/release/qarvix-ctl
            binaries/qarvix-tools/target/release/qarvix-dev
